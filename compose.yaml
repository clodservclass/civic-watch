services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: civicwatch
      POSTGRES_USER: civicwatch
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicwatch -d civicwatch"]
      interval: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://civicwatch:${DB_PASSWORD}@db:5432/civicwatch
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  db_data:
